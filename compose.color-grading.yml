services:
  app:
    environment:
      COLOR_GRADING_ENABLED: "true"
      COLOR_GRADING_BASE_URL: "http://video-color-grading:8000"

  video-color-grading:
    profiles: ["color-grading"]
    image: "${VCG_IMAGE:-videocolorgrading:0.1.0-api}"
    build:
      context: "${VCG_SOURCE_DIR:-../VideoColorGrading}"
      dockerfile: Dockerfile
    environment:
      VCG_DATABASE_URL: "postgresql://${VCG_POSTGRES_USER:-postgres}:${VCG_POSTGRES_PASSWORD:-postgres}@color-grading-postgres:5432/${VCG_POSTGRES_DB:-video_color_grading}"
      VCG_OUTPUT_ROOT: /app/runtime/color_grading/upstream
      ASCEND_RT_VISIBLE_DEVICES: "${VCG_ASCEND_RT_VISIBLE_DEVICES:-0}"
    depends_on:
      color-grading-postgres:
        condition: service_healthy
    expose:
      - "8000"
    stdin_open: true
    tty: true
    privileged: true
    shm_size: "${VCG_SHM_SIZE:-20g}"
    devices:
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/hisi_hdc:/dev/hisi_hdc
      - /dev/devmm_svm:/dev/devmm_svm
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - "${HOST_RUNTIME_DIR:-./runtime}:/app/runtime"
      - "${VCG_SOURCE_DIR:-../VideoColorGrading}:/VideoColorGrading"
      - "${VCG_PACKAGES_DIR:-../packages}:/VideoColorGrading/packages:ro"
      - "${VCG_PRETRAINED_MODELS_DIR:-../pretrained_models}:/VideoColorGrading/pretrained_models:ro"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
    restart: unless-stopped
    networks:
      - momentseek

  color-grading-postgres:
    profiles: ["color-grading"]
    image: "${VCG_POSTGRES_IMAGE:-postgres:16}"
    environment:
      POSTGRES_DB: "${VCG_POSTGRES_DB:-video_color_grading}"
      POSTGRES_USER: "${VCG_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${VCG_POSTGRES_PASSWORD:-postgres}"
    volumes:
      - "${VCG_DATABASE_DIR:-./runtime/color-grading-postgres}:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${VCG_POSTGRES_USER:-postgres} -d ${VCG_POSTGRES_DB:-video_color_grading}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - momentseek
