services:
  app:
    depends_on:
      milvus:
        condition: service_healthy

  etcd:
    image: "${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}"
    container_name: "${COMPOSE_PROJECT_NAME:-momentseek}-etcd"
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - "${HOST_RUNTIME_DIR:?请设置 HOST_RUNTIME_DIR}/etcd:/etcd"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - momentseek
  minio:
    image: "${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}"
    container_name: "${COMPOSE_PROJECT_NAME:-momentseek}-minio"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}"
    command: ["minio", "server", "/minio_data"]
    volumes:
      - "${HOST_RUNTIME_DIR:?请设置 HOST_RUNTIME_DIR}/minio:/minio_data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - momentseek

  milvus:
    image: "${MILVUS_IMAGE:-milvusdb/milvus:v2.6.20}"
    container_name: "${COMPOSE_PROJECT_NAME:-momentseek}-milvus"
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}"
    volumes:
      - "${HOST_RUNTIME_DIR:?请设置 HOST_RUNTIME_DIR}/milvus:/var/lib/milvus"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - momentseek
