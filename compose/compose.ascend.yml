services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ascend
      args:
        ASCEND_RUNTIME_IMAGE: "${ASCEND_RUNTIME_IMAGE:-swr.cn-south-1.myhuaweicloud.com/ascendhub/mindie:3.0.0b2-800I-A2-py311-openeuler24.03-lts}"
    environment:
      ENV_PROFILE: "${ENV_PROFILE:-prod.ascend}"
      NPU_ENABLED: "true"
      CUDA_ENABLED: "false"
      MODEL_MANIFEST: /app/deploy/models/runtime.models.json
      NPU_DEVICE_ID: "${NPU_DEVICE_ID:-0}"
      ASCEND_VISIBLE_DEVICES: "${ASCEND_VISIBLE_DEVICES:?请设置宿主机物理 NPU 卡号}"
      ASCEND_RT_VISIBLE_DEVICES: "${ASCEND_RT_VISIBLE_DEVICES:?请设置宿主机物理 NPU 卡号}"
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    devices:
      - "/dev/davinci${HOST_NPU_DEVICE_ID:?请设置 HOST_NPU_DEVICE_ID}:/dev/davinci${HOST_NPU_DEVICE_ID:?请设置 HOST_NPU_DEVICE_ID}"
      - "/dev/davinci_manager:/dev/davinci_manager"
      - "/dev/devmm_svm:/dev/devmm_svm"
      - "/dev/hisi_hdc:/dev/hisi_hdc"
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
